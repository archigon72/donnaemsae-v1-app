<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>원장 형식 확인 (읽기 전용) · 돈냄새연구소</title>
<style>body{font:15px/1.5 system-ui,sans-serif;margin:0;padding:16px;background:#fff;color:#1d2b22}h1{font-size:18px;margin:0 0 6px}p.n{font-size:13px;color:#4a5a50;margin:0 0 12px}table{border-collapse:collapse;width:100%;margin:0 0 16px;font-size:14px}th,td{border:1px solid #c9d2cc;padding:6px 8px;text-align:left;vertical-align:top;word-break:break-all;white-space:pre-wrap}th{background:#eef3ef;width:46%}h2{font-size:16px;margin:16px 0 6px}.ok{color:#1f6b3a;font-weight:700}.bad{color:#b3261e;font-weight:700}</style></head>
<body><h1>원장 형식 확인 (읽기 전용)</h1>
<p class="n">이 화면은 이 휴대폰 브라우저에 저장된 원장을 <b>읽기만</b> 해요. 저장값을 바꾸거나 지우지 않고, 어디로도 보내지 않아요. 금액·계좌 이름·종목명은 표시하지 않고 형식과 개수만 보여 줘요.</p>
<div id="out">확인 중…</div>
<script src="management-ledger.js?v=t257"></script>
<script>
/* T313 fix: read-only ledger diagnostic. No setItem/removeItem/clear anywhere. Shows key names, schema_version, counts only. */
(function(){'use strict';
var KEYS=[['dnmuat194.management.facts.v1','v1 원장 (v1·새 v1 화면이 읽는 곳)'],['dnmv2.management.facts.v1','v2 원장 (T312 이후 v2 테스트가 쓰는 곳)']];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function n(a){return Array.isArray(a)?a.length:(a&&typeof a==='object'?Object.keys(a).length:0)}
function row(k,v,cls){return '<tr><th>'+esc(k)+'</th><td'+(cls?' class="'+cls+'"':'')+'>'+esc(v)+'</td></tr>'}
var html='';
var names=[];try{for(var i=0;i<localStorage.length;i++)names.push(localStorage.key(i))}catch(e){names=['(읽기 실패: '+e.message+')']}
KEYS.forEach(function(kk){var key=kk[0],raw=null;try{raw=localStorage.getItem(key)}catch(e){}
 html+='<h2>'+esc(kk[1])+'</h2><table>'+row('저장 키',key);
 if(raw===null){html+=row('저장값','없음')+'</table>';return}
 html+=row('저장값 크기',raw.length+'자');
 var s;try{s=JSON.parse(raw)}catch(e){html+=row('JSON 형식','읽기 실패','bad')+'</table>';return}
 var sv=s&&s.schema_version;
 html+=row('schema_version',sv===undefined?'(없음)':sv,sv===1?'ok':'bad');
 html+=row('만든 날짜(created_at)',typeof s.created_at==='string'?s.created_at.slice(0,10):'(없음)');
 html+=row('계좌 수',n(s.accounts))+row('거래 수',n(s.transactions))+row('배당 사용 기록 수',n(s.dividend_uses));
 var tx=Array.isArray(s.transactions)?s.transactions:[];
 var nonKr=tx.filter(function(t){return !/^[0-9A-Z]{6}$/.test(t&&t.code)}).length,fx=tx.filter(function(t){return t&&t.currency!==undefined}).length;
 html+=row('6자리 국내 코드가 아닌 거래 수',nonKr,nonKr?'bad':'')+row('달러(USD) 거래 수',fx,fx?'bad':'');
 html+=row('직접 입력 종목 정보(instrument_names)',n(s.instrument_names),n(s.instrument_names)?'bad':'')+row('예수금 기록(cash_flows)',n(s.cash_flows),n(s.cash_flows)?'bad':'')+row('실입금 확정 기록',n(s.dividend_confirmations));
 var top=s&&typeof s==='object'?Object.keys(s).sort().join(', '):'';html+=row('최상위 항목 이름',top);
 if(key.indexOf('dnmuat194.')===0){var r;try{window.ManagementLedger.facts(JSON.parse(raw));r=['v1이 읽을 수 있음','ok']}catch(e){r=['v1이 읽지 못함: '+e.message,'bad']}html+=row('v1 읽기 시험(메모리에서만)',r[0],r[1])}
 html+='</table>';
});
html+='<h2>이 주소에 저장된 항목 이름</h2><table>'+row('개수',names.length)+row('이름',names.sort().join('\n')||'(없음)')+'</table>';
html+='<p class="n">확인 시각 '+esc(new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}))+' (한국 시간) · 이 화면을 캡처해서 보내 주시면 돼요.</p>';
document.getElementById('out').innerHTML=html;
})();
</script></body></html>
